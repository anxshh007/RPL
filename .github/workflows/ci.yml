name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - name: Install dependencies
        run: npm ci
      - name: Typecheck & compile (catches contract breaks between modules)
        run: npm run compile
      - name: Unit tests
        run: npm test
      - name: Guard — no direct model-provider calls in extension code
        run: |
          if grep -rInE "api\.openai\.com|generativelanguage\.googleapis|api\.anthropic\.com|from ['\"](openai|@anthropic-ai/sdk|@google/generative-ai)['\"]" src; then
            echo "Direct model-provider usage found. All model calls must go through TrueForge."; exit 1
          fi
